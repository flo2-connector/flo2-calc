name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: package (Python 3.12, the pinned set)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Installs exactly pyproject.toml's pins, with the test extra (pytest).
      - run: python -m pip install --disable-pip-version-check ".[test]"
      - run: python -m pip freeze --all
      - run: python -m pytest -v

  image:
    name: image (confined as flo2 runs a helper)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t flo2-calc:ci .
      - name: It answers --version with no network, a read-only root and an unprivileged user
        run: docker run --rm --network none --read-only --cap-drop ALL --user 65534:65534 flo2-calc:ci --version
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check ".[test]"
      # The conformance check (flo2's MUST tier, asked as flo2's plug asks it),
      # the tools over a real client session, and every host-set limit and the
      # not-yet-computed record, asked of the image under flo2-tool-sandbox's
      # flags and the image's own limits (flo2.io's profile). 128m is the cap
      # README.md's measurement supports; flo2's broker sets its own from that
      # measurement. Runaway calculations must be stopped with their reason and
      # the container must answer the next call: never a sandbox kill.
      - name: It meets flo2's helper contract, answers every tool, and stops at its limits, confined like flo2's slot
        env:
          FLO2_CALC_SERVER: >-
            docker run --rm -i --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m
            --memory 128m --memory-swap 128m --cpus 1 --pids-limit 64
            --cap-drop ALL --security-opt no-new-privileges --user 65534:65534
            --mount type=bind,source=${{ github.workspace }}/tests,target=/design,readonly
            flo2-calc:ci
        run: python -m pytest -v tests/test_conformance.py tests/test_server.py tests/test_limits.py tests/test_pending_record.py
