[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flo2-calc"
version = "0.6.1"
description = "Exact math and logic for the decisions in a design, as an MCP server: units checked, results re-runnable, every computation kept as a record a decision can cite."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Anthony Sligar" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["MCP", "calculator", "units", "exact arithmetic", "correct rounding", "arrays", "FFT", "design decisions", "reflow2"]

# EVERY dependency is pinned exactly. This list IS the set the image and the
# plugin install: the Dockerfile installs this package and nothing else, and
# tools/dependency_currency.py checks each pin against its latest release once
# a month. Why each one is here is in README.md, "What is pinned and why".
dependencies = [
  # The official MCP Python SDK, 2.x (OUR STANDARD; dec:evaluator-language).
  "mcp==2.3.0",
  # Units: what each unit measures and its exact factor to SI. pint parses its
  # definitions with flexparser and caches with flexcache, so they decide what
  # a unit IS: pinned with it, because a record must re-run to the same result.
  "pint==0.26.1",
  "flexparser==0.4",
  "flexcache==0.3",
  # Re-running a record checks it against its JSON Schema first.
  "jsonschema==4.26.0",
  # The rounded class (realmath.py): FLINT's Arb ball arithmetic, whose every
  # result is a ball that contains the true value. Correct rounding is decided
  # from those enclosures, so a rounded result does not depend on its version.
  "python-flint==0.9.0",
  # Arrays (arrays.py): the FFT (pocketfft) and float64 arithmetic over large
  # arrays, every float64 value labelled with a rigorous bound. Its version is
  # in produced_by: an FFT's last bits are pocketfft's.
  "numpy==2.5.3",
]

[project.optional-dependencies]
# mpmath: the tests' independent oracle for every rounded result (60+ digits),
# a different implementation from Arb. Never imported by the package.
test = ["pytest==9.1.1", "mpmath==1.4.1"]

[project.scripts]
flo2-calc = "flo2_calc:main"

[project.urls]
Homepage = "https://github.com/flo2-connector/flo2-calc"
Repository = "https://github.com/flo2-connector/flo2-calc"

# The served skill stays where the plugin formats keep it, skills/ at the root,
# its one copy: the wheel carries it as flo2_calc/skills/, so the server can
# offer it over MCP (skill.py) wherever it is installed.
[tool.setuptools]
package-dir = { "" = "src", "flo2_calc.skills" = "skills" }
packages = ["flo2_calc", "flo2_calc.skills"]

[tool.setuptools.package-data]
flo2_calc = ["schemas/*.json"]
"flo2_calc.skills" = ["*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
